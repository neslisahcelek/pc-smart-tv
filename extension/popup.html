<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <title>Smart TV Dizi Takip</title>
  <style>
    :root {
      --bg: #1e293b;
      --card-bg: #0f172a;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #0891b2;
      --accent-hover: #06b6d4;
      --success: #059669;
      --border: rgba(255, 255, 255, 0.1);
    }
    body {
      margin: 0;
      padding: 14px;
      width: 290px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .title {
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .server-status {
      font-size: 11px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--muted);
    }
    .status-dot.online {
      background: var(--success);
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .card-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    .series-name {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 4px;
      word-break: break-word;
    }
    .series-ep {
      font-size: 13px;
      color: var(--accent);
      font-weight: 600;
    }
    .status-pill {
      display: inline-block;
      margin-top: 8px;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      background: rgba(8, 145, 178, 0.2);
      color: var(--accent);
      border: 1px solid rgba(8, 145, 178, 0.4);
    }
    .btn {
      display: block;
      width: 100%;
      padding: 9px 12px;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      box-sizing: border-box;
      transition: background 0.15s ease;
      margin-bottom: 8px;
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover {
      background: var(--accent-hover);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.14);
    }
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
      font-size: 11px;
      color: var(--muted);
    }
    .footer a {
      color: var(--accent);
      text-decoration: none;
      cursor: pointer;
    }
    .footer a:hover {
      text-decoration: underline;
    }
    .toast {
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      background: var(--success);
      color: #fff;
      text-align: center;
      margin-bottom: 10px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">📺 Smart TV Takip</div>
    <div class="server-status">
      <span class="status-dot" id="serverDot"></span>
      <span id="serverLabel">Bağlanıyor...</span>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <div class="card" id="infoCard">
    <div class="card-title" id="cardLabel">Aktif Sekme</div>
    <div class="series-name" id="seriesTitle">Kontrol ediliyor...</div>
    <div class="series-ep" id="episodeLabel"></div>
    <div class="status-pill" id="statusPill" style="display: none;"></div>
  </div>

  <div id="actions">
    <button type="button" class="btn btn-primary" id="btnSaveNow" style="display: none;">
      🔖 Şimdi Sunucuya Kaydet
    </button>
    <button type="button" class="btn btn-secondary" id="btnAddSite" style="display: none;">
      ➕ Bu Siteyi Listeye Ekle
    </button>
  </div>

  <div class="footer">
    <span>Chrome 'dizi' klasörü senkronize</span>
    <a href="#" id="linkOptions">⚙️ Ayarlar</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
